pre-commit:
  parallel: true
  jobs:
    - name: lint
      run: bun run lint:fix
      stage_fixed: true
    - name: fmt
      run: bun run fmt
      stage_fixed: true
    - name: typecheck
      run: bun run typecheck
    - name: test
      run: bun run test

pre-push:
  parallel: true
  jobs:
    - name: fmt
      run: bun run fmt:check
    - name: lint
      run: bun run lint
    - name: typecheck
      run: bun run typecheck
